# Sample configuration. Folder IDs are placeholders; discover your Outlook IDs
# with `uv run outlook-organizer mail folders` before applying mail triage.
#
# Evaluation at a glance:
# - Every matching annotation applies. Annotations add context or prevent moves.
# - Routes run from top to bottom; only the first matching route is used.
# - Multiple fields under `when` are AND conditions.
# Distribution predicates used under `when` (they are not global switches):
# - `distribution_list: true`: a configured or Outlook-recognized group appears
#   as sender, To, or CC. This is broad presence detection.
# - `distribution_delivery: true`: a configured list sent the message, or a
#   recognized group is in To while no owner identity is directly in To. This is
#   the conservative choice for routing; a group only in CC does not match.
# - `distribution_list_group: NAME`: a configured list in sender, To, or CC
#   belongs to NAME. Use as an explicit route override for known lists.
version: 2

folder_scan_limit: 1000

# Optional conversation-aware filing. When enabled, Outlook's thread GUID is
# indexed in the local audit SQLite database. A known thread inherits the
# highest-priority configured destination seen in that conversation, and older
# managed messages are promoted with it. Flagged Inbox mail, junk mail, and
# unclassified external mail remain per-message exceptions: they neither
# inherit nor change the thread route. The index is prospective: existing
# filed mail is not scanned or backfilled. A SQL miss is authoritative and is
# treated as a new conversation; the thread is learned after a confirmed run.
# Manual moves are reconciled only for messages already known to the index.
threading:
  enabled: false

folders:
  inbox:
    name: Inbox
    id: 101

  organized_primary:
    name: aOrganized
    id: 102

  organized_secondary:
    name: bOrganized
    id: 103

  unclassified_external:
    name: Unclassified External
    id: 104
    parent: organized_secondary

  safe_external:
    name: Safe External
    id: 105
    parent: organized_primary

  leadership:
    name: Leadership
    id: 106
    parent: organized_primary

  my_team:
    name: My Team
    id: 107
    parent: organized_primary

  company_announcements:
    name: Company Announcements
    id: 108
    parent: organized_primary

  assistants:
    name: Assistants
    id: 109
    parent: organized_primary

  internal_general:
    name: Internal General
    id: 110
    parent: organized_primary

  junk_external:
    name: Junk External
    id: 111
    parent: organized_secondary

annotations:
  # Matches: Outlook's action flag is currently set.
  # Result: report as Needs attention and keep in Inbox, overriding any route.
  - id: flagged-needs-action
    description: Keep flagged messages visible in the Inbox
    when:
      flagged: true
    section: Needs attention
    add_category: "@Action"
    keep_in_inbox: true

  # Matches: every distinct To address is an owner identity and CC is empty.
  # Result: add context only; routing continues normally.
  - id: sent-only-to-me
    description: Message is addressed only to me
    when:
      recipient: only_me
    add_category: "@Only Me"

routes:
  # Matches: sender is listed in groups.leadership.
  - id: route-leadership
    description: Mail from configured leaders
    when:
      sender_group: leadership
    move_to: leadership
    category: "@Leadership"

  # Matches: sender is listed in groups.assistants.
  - id: route-assistants
    description: Mail from assistants
    when:
      sender_group: assistants
    move_to: assistants
    category: "@Assistants"

  # Matches: sender is listed in groups.my_team.
  - id: route-my-team
    description: Mail from team members
    when:
      sender_group: my_team
    move_to: my_team
    category: "@My Team"

  # Explicit override: a configured company_announcements address appears as
  # sender, To, or CC. Use this for lists that should always be routed here.
  - id: route-company-announcements
    description: Configured company distribution lists
    when:
      sender_type: internal
      distribution_list_group: company_announcements
    move_to: company_announcements
    category: "@Company Announcements"

  # Fallback for unconfigured internal groups. It matches only when the group
  # appears to be the delivery path, so a group copied only on CC does not match.
  - id: route-other-internal-distribution
    description: Internal mail delivered through an Outlook-recognized group
    when:
      sender_type: internal
      distribution_delivery: true
    move_to: company_announcements
    category: "@Company Announcements"

  # Matches: an explicitly junk sender/domain, or otherwise-unclassified external
  # mail whose subject or sender address contains a configured junk keyword.
  - id: route-junk-external
    description: Known junk senders and unclassified external mail with a junk keyword
    when:
      sender_type: junk_external
    move_to: junk_external
    category: "@Junk External"

  # Matches: external sender address or domain explicitly configured as safe.
  - id: route-safe-external
    description: Mail from an approved external domain or sender
    when:
      sender_type: safe_external
    move_to: safe_external
    category: "@Safe External"

  # Matches: external sender that is neither safe nor known junk.
  - id: route-unclassified-external
    description: External mail not classified as safe or known junk
    when:
      sender_type: unclassified_external
    move_to: unclassified_external
    category: "@Unclassified External"

  # Broad internal fallback. Keep this after people and distribution routes.
  - id: route-internal-general
    description: General internal mail
    when:
      sender_type: internal
    move_to: internal_general
    category: "@Internal General"

# Used only when no route above matches. This catches unknown/unparseable senders.
default:
  keep_in_inbox: true
  category: "@Others"
  section: Others
